<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="100%" height="auto" role="img" aria-label="Perbandingan Mode Tongkrongan dan Mode Cinta">
  <rect width="1200" height="370" fill="#FAF6EE" />

  <!-- Left Card: MODE TONGKRONGAN -->
  <g transform="translate(24, 20)">
    <rect x="8" y="8" width="556" height="322" fill="#111111" />
    <rect x="0" y="0" width="556" height="322" fill="#FFFFFF" stroke="#111111" stroke-width="3.5" />

    <!-- Header -->
    <rect x="0" y="0" width="556" height="54" fill="#FFE600" stroke="#111111" stroke-width="3.5" />
    <rect x="16" y="13" width="110" height="28" fill="#111111" />
    <text x="25" y="32" font-family="'Courier New', monospace" font-size="12.5" font-weight="700" fill="#FFE600">1–12 PEMAIN</text>
    <text x="140" y="34" font-family="'Segoe UI', Arial, sans-serif" font-size="19" font-weight="800" fill="#111111">MODE TONGKRONGAN (PARTY)</text>

    <text x="20" y="84" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#222222">
      Mode kompetitif untuk mabar bareng teman, sahabat, atau grup.
    </text>
    <text x="20" y="106" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#222222">
      Kumpulkan skor tertinggi di setiap ronde untuk naik ke podium juara!
    </text>

    <!-- Mockup Scoreboard Podium -->
    <g transform="translate(20, 128)">
      <!-- #1 Row -->
      <rect x="3" y="3" width="516" height="46" fill="#111111" />
      <rect x="0" y="0" width="516" height="46" fill="#B8FF01" stroke="#111111" stroke-width="2.5" />
      <rect x="12" y="10" width="44" height="26" fill="#111111" />
      <text x="22" y="28" font-family="'Courier New', monospace" font-size="13" font-weight="700" fill="#FFE600">#1</text>
      <text x="70" y="29" font-family="'Segoe UI', Arial, sans-serif" font-size="15.5" font-weight="800" fill="#111111">Raka · Juara Tongkrongan 🏆</text>
      <text x="405" y="29" font-family="'Courier New', monospace" font-size="15" font-weight="700" fill="#111111">+3,450 PTS</text>

      <!-- #2 Row -->
      <rect x="3" y="59" width="516" height="42" fill="#111111" />
      <rect x="0" y="56" width="516" height="42" fill="#FAF6EE" stroke="#111111" stroke-width="2.5" />
      <rect x="12" y="64" width="44" height="26" fill="#111111" />
      <text x="22" y="82" font-family="'Courier New', monospace" font-size="13" font-weight="700" fill="#FFFFFF">#2</text>
      <text x="70" y="82" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#111111">Sinta · Kuping Emas ⚡</text>
      <text x="405" y="82" font-family="'Courier New', monospace" font-size="14.5" font-weight="700" fill="#111111">+2,800 PTS</text>

      <!-- #3 Row -->
      <rect x="3" y="111" width="516" height="42" fill="#111111" />
      <rect x="0" y="108" width="516" height="42" fill="#FAF6EE" stroke="#111111" stroke-width="2.5" />
      <rect x="12" y="116" width="44" height="26" fill="#111111" />
      <text x="22" y="134" font-family="'Courier New', monospace" font-size="13" font-weight="700" fill="#FFFFFF">#3</text>
      <text x="70" y="134" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#111111">Budi</text>
      <text x="405" y="134" font-family="'Courier New', monospace" font-size="14.5" font-weight="700" fill="#111111">+2,150 PTS</text>
    </g>
  </g>

  <!-- Right Card: MODE CINTA -->
  <g transform="translate(616, 20)">
    <rect x="8" y="8" width="556" height="322" fill="#111111" />
    <rect x="0" y="0" width="556" height="322" fill="#FFFFFF" stroke="#111111" stroke-width="3.5" />

    <!-- Header -->
    <rect x="0" y="0" width="556" height="54" fill="#FF66C4" stroke="#111111" stroke-width="3.5" />
    <rect x="16" y="13" width="116" height="28" fill="#111111" />
    <text x="24" y="32" font-family="'Courier New', monospace" font-size="12.5" font-weight="700" fill="#FF66C4">KHUSUS 2P ❤️</text>
    <text x="146" y="34" font-family="'Segoe UI', Arial, sans-serif" font-size="19" font-weight="800" fill="#111111">MODE CINTA (COUPLE / LDR)</text>

    <text x="20" y="84" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#222222">
      Mode spesial berdua pasangan dengan sistem nyawa hati (Heart Bar)
    </text>
    <text x="20" y="106" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#222222">
      dan fitur Kamus Mode Bucin yang bisa dikustomisasi sesuka kalian.
    </text>

    <!-- Sub-mode 1: Survival -->
    <g transform="translate(20, 128)">
      <rect x="3" y="3" width="516" height="72" fill="#111111" />
      <rect x="0" y="0" width="516" height="72" fill="#FFE4F2" stroke="#111111" stroke-width="2.5" />
      <rect x="14" y="12" width="145" height="24" fill="#111111" />
      <text x="22" y="28" font-family="'Courier New', monospace" font-size="11" font-weight="700" fill="#FF8DA1">SURVIVAL CO-OP ∞</text>
      <text x="170" y="29" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="800" fill="#111111">NYAWA BERSAMA: ❤️❤️❤️❤️🤍 (4.5/5)</text>
      <text x="14" y="55" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#222222">
        Jaga hati bersama pasangan! Salah tebak mengurangi 0.5 hati bersama.
      </text>

      <!-- Sub-mode 2: Battle -->
      <rect x="3" y="89" width="516" height="72" fill="#111111" />
      <rect x="0" y="86" width="516" height="72" fill="#FFE600" stroke="#111111" stroke-width="2.5" />
      <rect x="14" y="98" width="145" height="24" fill="#111111" />
      <text x="22" y="114" font-family="'Courier New', monospace" font-size="11" font-weight="700" fill="#FFE600">BATTLE 1V1 DUEL</text>
      <text x="170" y="115" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="800" fill="#111111">KAMU: ❤️❤️❤️  vs  PASANGAN: ❤️❤️🤍</text>
      <text x="14" y="141" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#222222">
        Duel 1 lawan 1 — masing-masing pegang nyawa sendiri sampai habis!
      </text>
    </g>
  </g>
</svg>
